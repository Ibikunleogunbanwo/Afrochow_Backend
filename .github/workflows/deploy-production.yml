name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      SPRING_PROFILES_ACTIVE: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: |
          chmod +x ./mvnw
          ./mvnw -B test

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile
        run: |
          chmod +x ./mvnw
          ./mvnw -q -DskipTests compile

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail

          test -n "$VPS_HOST"
          test -n "$VPS_PORT"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/afrochow_vps
          chmod 600 ~/.ssh/afrochow_vps

          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/afrochow_vps -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          cd /opt/afrochow

          echo "Preparing Git checkout..."
          git config --global --add safe.directory /opt/afrochow

          if [ "$(id -u)" -eq 0 ]; then
            chown -R "$(id -u):$(id -g)" /opt/afrochow
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo chown -R "$(id -u):$(id -g)" /opt/afrochow
          fi

          echo "Updating application..."
          if git fetch origin main; then
            git reset --hard origin/main
            git clean -fd
          else
            echo "Git fetch failed, falling back to a fresh source sync..."

            TMP_RELEASE="$(mktemp -d)"
            git clone --depth 1 --branch main https://github.com/Ibikunleogunbanwo/Afrochow_Backend.git "$TMP_RELEASE"

            rsync -a --delete \
              --exclude '.git/' \
              --exclude '.env.prod' \
              --exclude 'deploy/nginx/certs/' \
              "$TMP_RELEASE"/ /opt/afrochow/

            rm -rf "$TMP_RELEASE"
          fi

          echo "Verifying required files..."
          test -f .env.prod
          test -f deploy/nginx/certs/cloudflare-origin.pem
          test -f deploy/nginx/certs/cloudflare-origin.key

          echo "Validating Docker Compose configuration..."
          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            config --quiet

          echo "Repairing failed showroom migration attempts..."
          DB_USERNAME="$(grep "^DB_USERNAME=" .env.prod | cut -d= -f2-)"
          DB_PASSWORD="$(grep "^DB_PASSWORD=" .env.prod | cut -d= -f2-)"
          DB_NAME="$(grep "^DB_NAME=" .env.prod | cut -d= -f2-)"

          docker exec -i afrochow-mysql mysql \
            -u"$DB_USERNAME" \
            -p"$DB_PASSWORD" \
            "$DB_NAME" \
            -e "DELETE FROM flyway_schema_history WHERE version IN ('40','42','43') AND success = 0;"

          echo "Removing any stale application containers..."
          docker ps -a \
            --filter "name=afrochow-app" \
            --format '{{.Names}}' \
            | xargs -r docker rm -f

          echo "Deploying updated containers..."
          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            up -d mysql redis kafka

          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            up -d --build --force-recreate --no-deps app nginx db-backup kafka-ui kafka-init

          echo "Reloading Nginx..."
          docker exec afrochow-nginx nginx -s reload || true

          echo "Waiting for application to become healthy..."

          for attempt in $(seq 1 30); do
            if curl -kfsS \
              -H "Host: api.afrochow.ca" \
              https://127.0.0.1/api/actuator/health \
              | grep -q '"status":"UP"'; then

              echo "✅ Afrochow API is healthy"

              echo "Showroom migration summary:"
              docker exec -i afrochow-mysql mysql \
                -u"$DB_USERNAME" \
                -p"$DB_PASSWORD" \
                "$DB_NAME" \
                -e "SELECT version, description, success, installed_on
                    FROM flyway_schema_history
                    WHERE version IN ('39','40','42','43')
                    ORDER BY installed_rank;
                    SELECT a.city, a.province, COUNT(*) AS active_verified_vendors
                    FROM vendor_profile vp
                    JOIN users u ON u.user_id = vp.user_id
                    JOIN address a ON a.address_id = vp.address_id
                    WHERE u.public_user_id REGEXP '^VEN-(ONTOR|BCVAN|MBWPG|SKSSK|NSHAL|NBMON|PECHA|NLSTJ)'
                      AND vp.is_active = TRUE
                      AND vp.is_verified = TRUE
                    GROUP BY a.city, a.province
                    ORDER BY a.province, a.city;"

              docker compose \
                --env-file .env.prod \
                -f docker-compose.prod.yml \
                ps

              exit 0
            fi

            echo "Health check not ready yet (${attempt}/30)..."
            sleep 5
          done

          echo "❌ Deployment health check failed"

          echo "Container status:"
          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            ps

          echo
          echo "===== Spring Boot Logs ====="
          docker logs --tail=200 afrochow-app || true

          echo
          echo "===== Nginx Logs ====="
          docker logs --tail=100 afrochow-nginx || true

          exit 1
          REMOTE
